name: Grab OCI A1 free instance

on:
    workflow_dispatch: {} # manual "Run workflow" button — use this to test
    schedule:
        # Every 5 min, offset by 2 (:02, :07, :12 ...). The :00/:05 slots are the
        # most congested on GitHub and get delayed or skipped; an odd offset fires
        # more reliably. Changing this line also forces GitHub to re-register the
        # schedule after the workflow has been disabled/re-enabled.
        - cron: "2-59/5 * * * *"

concurrency:
    group: oci-a1-grab # never run two attempts at once
    cancel-in-progress: false

permissions:
    contents: read
    issues: write # so we can open a "you got it!" issue on success
    actions: write # so a run can dispatch the next attempt (see last step)

jobs:
    launch:
        runs-on: ubuntu-latest
        env:
            # --- auth (set these as repo secrets) ---
            OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
            OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
            OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
            OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
            OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
            OCI_CLI_AUTH: api_key
            # --- where/what to launch ---
            OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }} # optional; defaults to tenancy
            OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
            SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
            OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }} # optional; auto-resolved if unset
            DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }} # optional; pings on success
            # --- shape knobs (override via repo Variables if you like) ---
            OCI_OCPUS: ${{ vars.OCI_OCPUS || '2' }}
            OCI_MEMORY_GB: ${{ vars.OCI_MEMORY_GB || '12' }}
            OCI_DISPLAY_NAME: ${{ vars.OCI_DISPLAY_NAME || 'mnsh1' }}
            OCI_BOOT_VOLUME_GB: ${{ vars.OCI_BOOT_VOLUME_GB || '200' }}
            OCI_OS: ${{ vars.OCI_OS || 'Canonical Ubuntu' }}
            OCI_OS_VERSION: ${{ vars.OCI_OS_VERSION || '24.04' }}
            OCI_IMAGE_NAME_FILTER: ${{ vars.OCI_IMAGE_NAME_FILTER || 'Minimal' }} # picks Ubuntu 24.04 Minimal aarch64
        steps:
            - uses: actions/checkout@v4

            - name: Install OCI CLI
              run: pip install --quiet --upgrade oci-cli

            - name: Attempt launch
              id: launch
              run: bash ./launch.sh

            - name: Open an issue on success
              if: steps.launch.outputs.created == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  # This repo is public, so this issue is world-readable — keep it generic.
                  # The actual IP/OCID go only to Discord (private) and the OCI console.
                  gh issue create \
                    --title "🎉 A2 instance created" \
                    --body "Your VPS instance is RUNNING.

                  The public IP was sent to your Discord webhook and is in the OCI console.
                  (IP/OCID are intentionally omitted here because this repo is public.)

                  You can now **disable this workflow** (Actions → this workflow → ⋯ → Disable workflow)."

            - name: Ping Discord on success
              if: steps.launch.outputs.created == 'true' && env.DISCORD_WEBHOOK != ''
              env:
                  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
                  IID: ${{ steps.launch.outputs.instance_id }}
                  IP: ${{ steps.launch.outputs.public_ip }}
              run: |
                  content="🎉 **OCI A1 instance is live!**
                  **Public IP:** \`$IP\`
                  **OCID:** \`$IID\`
                  SSH: \`ssh ubuntu@$IP\`  (user \`opc\` on Oracle Linux)
                  Remember to disable the retry workflow."
                  jq -n --arg c "$content" '{content: $c}' \
                    | curl -fsS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"

            - name: Queue the next attempt (self-chain)
              # GitHub skips most slots of a 5-min cron in a quiet repo (we saw
              # ~2 h gaps), so each run dispatches the next one itself. Only after a
              # SOFT miss (capacity / 429): a hard error (bad secret, quota) ends the
              # chain so it can't loop on a broken config, and the cron above is a
              # sparse backstop that restarts it. Disabling the workflow in the
              # Actions tab stops the chain (the dispatch is refused).
              if: >-
                  steps.launch.outcome == 'success' &&
                  steps.launch.outputs.created != 'true' &&
                  steps.launch.outputs.exists != 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  DELAY: ${{ vars.OCI_RETRY_DELAY_SECONDS || '120' }} # gap before the next attempt
              run: |
                  echo "Waiting ${DELAY}s before queuing the next attempt..."
                  sleep "$DELAY"
                  # If another run is already queued/running (e.g. the cron fired
                  # meanwhile), let it carry the chain instead of starting a second one.
                  others="$(gh run list --workflow retry.yml --limit 20 --json databaseId,status \
                    --jq "[.[] | select(.databaseId != ${GITHUB_RUN_ID})
                               | select(.status | IN(\"queued\",\"in_progress\",\"pending\",\"waiting\",\"requested\"))] | length")"
                  if [[ "${others:-0}" -gt 0 ]]; then
                    echo "Another run is already queued — it will continue the chain."
                    exit 0
                  fi
                  gh workflow run retry.yml --ref "$GITHUB_REF_NAME" \
                    && echo "Next attempt queued." \
                    || echo "::warning::Could not queue the next run (workflow disabled?). Chain ends here; the cron remains as a backstop."
